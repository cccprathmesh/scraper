name: Unlimited Furniture - Parallel Sitemap Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base site URL"
        required: true
        default: "https://www.unlimitedfurnituregroup.com"
      scrape_mode:
        description: "Scrape Mode: 'remaining' (only pending/unscraped URLs in DB) or 'full' (all URLs)"
        required: true
        default: "remaining"
        type: choice
        options:
          - remaining
          - full
      max_runners:
        description: "Max parallel runners (matrix jobs, max 250)"
        default: "120"
      total_sitemaps:
        description: "Total sitemaps to process (0 = auto / all, used when resume mode is off)"
        default: "0"
      sitemaps_per_job:
        description: "Sitemaps per parallel job (used when resume mode is off)"
        default: "2"
      urls_per_sitemap:
        description: "Max URLs per sitemap (0 = all)"
        default: "0"
      max_workers:
        description: "Parallel requests per job"
        default: "4"
      request_delay:
        description: "Delay between requests (seconds)"
        default: "0.5"

env:
  MYSQL_HOST: ${{ secrets.MYSQL_HOST || '2.24.198.101' }}
  MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
  MYSQL_USER: ${{ secrets.MYSQL_USER || 'root' }}
  MYSQL_PASS: ${{ secrets.MYSQL_PASS || 'Root@123456' }}
  MYSQL_DB: ${{ secrets.MYSQL_DB || 'google_shopping' }}
  SCRAPE_MODE: ${{ github.event.inputs.scrape_mode || 'remaining' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      site_name: ${{ steps.get_site_name.outputs.site_name }}
      has_url_chunks: ${{ steps.build_matrix.outputs.has_url_chunks }}
    steps:
      - name: Extract site name from URL
        id: get_site_name
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | sed -E 's|https?://||;s|www\.||;s|\.[a-zA-Z]+(/.*)?$||;s|/.*||')
          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "Site name: $SITE_NAME"

      - name: Build clean runner matrix
        id: build_matrix
        env:
          BASE_URL: ${{ github.event.inputs.url }}
          TOTAL_SITEMAPS: ${{ github.event.inputs.total_sitemaps }}
          PER_JOB: ${{ github.event.inputs.sitemaps_per_job }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os
          import json
          import glob
          import urllib.request
          import re
          from xml.etree import ElementTree as ET

          # Standard sitemap-driven discovery
          url = os.environ.get("BASE_URL", "https://www.unlimitedfurnituregroup.com").rstrip("/")
          total_input = int(os.environ.get("TOTAL_SITEMAPS", "0") or "0")
          per_job = int(os.environ.get("PER_JOB", "2") or "2")
          if per_job < 1:
              per_job = 2

          index_urls = []
          try:
              req = urllib.request.Request(f"{url}/robots.txt", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  for line in resp.read().decode("utf-8").splitlines():
                      if line.strip().lower().startswith("sitemap:"):
                          s = line.split(":", 1)[1].strip()
                          if s and s not in index_urls:
                              index_urls.append(s)
          except Exception as e:
              print(f"Robots fetch error: {e}")

          if not index_urls:
              index_urls = [f"{url}/sitemap.xml", f"{url}/pub/sitemap/sitemap.xml"]

          child_sitemaps = []
          for idx in index_urls:
              try:
                  req = urllib.request.Request(idx, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode("utf-8")
                      text = re.sub(r'<script[^>]*/>', '', text)
                      text = re.sub(r'<script[^>]*>.*?</script>', '', text, flags=re.DOTALL)
                      root = ET.fromstring(text)
                      for loc in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc'):
                          val = loc.text.strip() if loc.text else ""
                          if val:
                              fname = val.split("/")[-1]
                              if not any(existing.split("/")[-1] == fname for existing in child_sitemaps):
                                  child_sitemaps.append(val)
              except Exception as e:
                  print(f"Error parsing sitemap index {idx}: {e}")

          total_found = len(child_sitemaps) or 16
          print(f"Discovered {total_found} unique child sitemaps in total.")

          if total_input > 0:
              total_to_process = min(total_input, total_found)
          else:
              total_to_process = total_found

          jobs = (total_to_process + per_job - 1) // per_job
          matrix_items = []
          for i in range(jobs):
              offset = i * per_job
              limit = min(per_job, total_to_process - offset)
              matrix_items.append({
                  "chunk_id": str(offset),
                  "offset": offset,
                  "limit": limit,
                  "is_resume": "false"
              })

          matrix_json = json.dumps({"include": matrix_items})
          print(f"Planned {len(matrix_items)} jobs for {total_to_process} sitemaps (per job: {per_job})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
              f.write("has_url_chunks=false\n")
          EOF

      - name: Upload URL chunks artifact
        if: steps.build_matrix.outputs.has_url_chunks == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unlimited_url_chunks
          path: url_chunks
          retention-days: 2

  scrape:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix || '{"include":[]}') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml urllib3 curl_cffi pymysql

      - name: Download URL chunks artifact
        if: needs.plan.outputs.has_url_chunks == 'true'
        uses: actions/download-artifact@v4
        with:
          name: unlimited_url_chunks
          path: url_chunks

      - name: Run unlimitedfurniture scraper
        env:
          CHUNK_ID:             ${{ matrix.chunk_id }}
          URLS_FILE:            ${{ matrix.is_resume == 'true' && format('url_chunks/chunk_{0}.txt', matrix.chunk_id) || '' }}
          FLARESOLVERR_URL:     "http://localhost:8191/v1"
          CURR_URL:             ${{ github.event.inputs.url }}
          SITEMAP_OFFSET:       ${{ matrix.offset || '0' }}
          MAX_SITEMAPS:         ${{ matrix.limit || '0' }}
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS:          ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY:        ${{ github.event.inputs.request_delay }}
          MYSQL_HOST:           ${{ secrets.MYSQL_HOST || '2.24.198.101' }}
          MYSQL_PORT:           ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER:           ${{ secrets.MYSQL_USER || 'root' }}
          MYSQL_PASS:           ${{ secrets.MYSQL_PASS || 'Root@123456' }}
          MYSQL_DB:             ${{ secrets.MYSQL_DB || 'google_shopping' }}
          SCRAPE_MODE:          ${{ github.event.inputs.scrape_mode || 'remaining' }}
        run: |
          echo "========================================"
          echo " unlimitedfurniture Scraper — Job Configuration"
          echo "========================================"
          echo "CHUNK_ID             : $CHUNK_ID"
          echo "URLS_FILE            : $URLS_FILE"
          echo "CURR_URL             : $CURR_URL"
          echo "SITEMAP_OFFSET       : $SITEMAP_OFFSET"
          echo "MAX_SITEMAPS         : $MAX_SITEMAPS"
          echo "MAX_URLS_PER_SITEMAP : $MAX_URLS_PER_SITEMAP"
          echo "MAX_WORKERS          : $MAX_WORKERS"
          echo "REQUEST_DELAY        : $REQUEST_DELAY"
          echo "========================================"

          python unlimited_furniture/unlimited_furniture.py

          echo ""
          echo "Generated files:"
          ls -la media/output/scrapping/unlimitedfurniture/unlimitedfurniture_products_chunk_*.csv 2>/dev/null || echo "No CSV files generated"

      - name: Upload chunk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk_${{ matrix.chunk_id }}
          path: |
            url_list_chunk_*.txt
            media/output/scrapping/unlimitedfurniture/unlimitedfurniture_products_chunk_*.csv
            media/output/scrapping/failure_csv/unlimitedfurniture_failures.csv
            media/output/scrapping/failure_csv/unlimitedfurniture_skipped_plp_*.csv
          if-no-files-found: warn

  merge:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Merge CSV chunks and combine with existing FTP data
        id: merge_csv
        env:
          RESUME_MODE: ${{ github.event.inputs.resume_unscraped_only != 'false' && github.event.inputs.resume_unscraped_only != '' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap' }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import glob
          import os
          import csv

          chunk_files = glob.glob("chunks/**/unlimitedfurniture_products_chunk_*.csv", recursive=True)
          rows = []
          header = None
          seen_urls = set()

          for cf in sorted(chunk_files):
              try:
                  with open(cf, "r", encoding="utf-8") as f:
                      r = csv.reader(f)
                      cf_header = next(r, None)
                      if not header and cf_header:
                          header = cf_header
                      for row in r:
                          if row:
                              u = row[0].strip()
                              if u not in seen_urls:
                                  seen_urls.add(u)
                                  rows.append(row)
              except Exception as e:
                  print(f"Error reading {cf}: {e}")

          print(f"Merged {len(rows):,} products from {len(chunk_files)} chunk files.")
          if not header:
              header = [
                  "Ref Product URL", "Ref Product ID", "Ref Category", "Ref Category URL",
                  "Ref Brand Name", "Ref Product Name", "Ref SKU", "Ref MPN", "Ref GTIN",
                  "Ref Price", "Ref Main Image", "Ref Quantity", "Ref Group Attr 1",
                  "Ref Group Attr 2", "Ref Status", "Date Scrapped"
              ]

          with open("unlimitedfurniture_products_full.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header)
              w.writerows(rows)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fo:
              fo.write(f"final_rows={len(rows)}\n")
          EOF

      - name: Merge failure logs
        if: always()
        run: |
          FAIL_FILES=$(find chunks -name "unlimitedfurniture_failures.csv" 2>/dev/null)
          if [ -z "$FAIL_FILES" ]; then
            echo "No failure logs found."
            exit 0
          fi

          FIRST=$(echo "$FAIL_FILES" | head -n 1)
          head -n 1 "$FIRST" > unlimitedfurniture_failures_full.csv
          for f in $FAIL_FILES; do
            tail -n +2 "$f" | sed '/^$/d' >> unlimitedfurniture_failures_full.csv
          done

          FAIL_COUNT=$(tail -n +2 unlimitedfurniture_failures_full.csv | wc -l)
          echo "Total failed URLs: $FAIL_COUNT"

      - name: Merge skipped PLP logs
        if: always()
        run: |
          SKIPPED_FILES=$(find chunks -name "unlimitedfurniture_skipped_plp_*.csv" 2>/dev/null)
          if [ -z "$SKIPPED_FILES" ]; then
            echo "No skipped PLP logs found."
            exit 0
          fi

          FIRST=$(echo "$SKIPPED_FILES" | head -n 1)
          head -n 1 "$FIRST" > skipped_plp.csv
          for f in $SKIPPED_FILES; do
            tail -n +2 "$f" | sed '/^$/d' >> skipped_plp.csv
          done

          SKIPPED_COUNT=$(tail -n +2 skipped_plp.csv | wc -l)
          echo "Total skipped PLP URLs: $SKIPPED_COUNT"

      - name: Build output filename
        id: meta
        run: |
          SITE_NAME="${{ needs.plan.outputs.site_name }}"
          [ -z "$SITE_NAME" ] && SITE_NAME="unlimitedfurniture"
          DATE=$(date +%F_%H%M%S)
          FILENAME="${SITE_NAME}_${DATE}.csv"
          echo "name=$FILENAME" >> $GITHUB_OUTPUT
          echo "Output filename: $FILENAME"

      - name: Merge per-chunk URL lists
        id: merge_urls
        run: |
          find chunks -name "url_list_chunk_*.txt" 2>/dev/null | sort | xargs cat 2>/dev/null | sort -u > all_sitemap_urls.txt || true
          URL_COUNT=$(wc -l < all_sitemap_urls.txt | tr -d ' ')
          echo "Total unique sitemap URLs: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT

      - name: Build FTP directory structure
        id: ftp_structure
        env:
          RESUME_MODE: ${{ github.event.inputs.resume_unscraped_only != 'false' && github.event.inputs.resume_unscraped_only != '' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap' }}
        run: |
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          COMPETITOR="Unlimitedfurniture"

          echo "competitor=$COMPETITOR" >> $GITHUB_OUTPUT
          echo "date_str=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          INPUT_DIR="ftp_output/${COMPETITOR}/${DATE}/input"
          TEMP_DIR="ftp_output/${COMPETITOR}/${DATE}/output/temp"
          FINAL_DIR="ftp_output/${COMPETITOR}/${DATE}/output"

          mkdir -p "$INPUT_DIR" "$TEMP_DIR" "$FINAL_DIR"

          INPUT_URL="$INPUT_DIR/URLList${TIMESTAMP}.csv"
          TEMP_URL="$TEMP_DIR/URLListForScrap${TIMESTAMP}.csv"
          FINAL_SCRAPED="$FINAL_DIR/FinalScrappedData${TIMESTAMP}.csv"
          FINAL_URL="$FINAL_DIR/FinalURLListForScrap${TIMESTAMP}.csv"

          # If in resume mode, try to fetch the master URLList from FTP so full tracking is preserved
          python3 -c "
          import os, ftplib, io
          resume_mode = os.environ.get('RESUME_MODE', 'false').lower() in ('true', '1', 'yes')
          ftp_host = os.environ.get('FTP_HOST', '').strip()
          ftp_user = os.environ.get('FTP_USER', '').strip()
          ftp_pass = os.environ.get('FTP_PASS', '').strip()
          ftp_port = int(os.environ.get('FTP_PORT', '21') or '21')
          ftp_path = os.environ.get('FTP_PATH', '/scrap').rstrip('/')
          if ftp_host and ftp_user and ftp_pass:
              try:
                  ftp = ftplib.FTP()
                  ftp.connect(ftp_host, ftp_port, timeout=30)
                  ftp.login(ftp_user, ftp_pass)
                  comp_dir = f'{ftp_path}/Unlimitedfurniture'
                  date_dirs = sorted([d for d in ftp.nlst(comp_dir) if d.split('/')[-1].isdigit()])
                  if date_dirs:
                      latest_d = sorted(date_dirs)[-1]
                      temp_dir = f'{latest_d}/output/temp'
                      files = ftp.nlst(temp_dir)
                      url_files = [f for f in files if 'URLListForScrap' in f and f.endswith('.csv')]
                      if url_files:
                          latest_u = sorted(url_files)[-1]
                          with open('$TEMP_URL', 'wb') as f_out:
                              ftp.retrbinary(f'RETR {latest_u}', f_out.write)
                          print(f'Fetched existing master URLListForScrap from FTP: {latest_u}')
                  ftp.quit()
              except Exception as e:
                  print(f'Could not fetch existing URLListForScrap: {e}')
          " || true

          if [ ! -s "$TEMP_URL" ]; then
            cp all_sitemap_urls.txt "$INPUT_URL" 2>/dev/null || true
            cp all_sitemap_urls.txt "$TEMP_URL" 2>/dev/null || true
          fi

          cp unlimitedfurniture_products_full.csv "$FINAL_SCRAPED" 2>/dev/null || true

          echo "FTP structure prepared:"
          find ftp_output -type f | sort

      - name: Generate FinalURLListForScrap
        run: |
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          TIMESTAMP="${{ steps.ftp_structure.outputs.timestamp }}"

          SCRAPED="ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv"
          URLS="ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv"
          OUT="ftp_output/${COMPETITOR}/${DATE}/output/FinalURLListForScrap${TIMESTAMP}.csv"

          if [ -f "$URLS" ] && [ -f "$SCRAPED" ] && [ -s "$SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$URLS" --scraped-file "$SCRAPED" --output-file "$OUT" || true
            echo "Generated FinalURLListForScrap: $OUT"
          fi

      - name: Upload to FTP
        run: |
          if [ -n "$FTP_HOST" ]; then
            COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
            DATE="${{ steps.ftp_structure.outputs.date_str }}"
            echo "Uploading $COMPETITOR output to FTP server..."
            python3 ftp_manager.py upload -c "$COMPETITOR" -b ftp_output || {
              echo "ftp_manager upload failed, falling back to lftp..."
              which lftp >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y lftp)
              BASE="${FTP_PATH:-$FTP_BASE_DIR}/${COMPETITOR}/${DATE}"
              lftp -e "set ftp:ssl-allow no; mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}; bye" -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" || true
              echo "FTP upload complete: ${BASE}"
            } || true
          else
            echo "FTP_HOST not configured - skipping upload"
          fi
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_PORT:     ${{ secrets.FTP_PORT || '21' }}
          FTP_PATH:     ${{ secrets.FTP_PATH || secrets.FTP_BASE_DIR }}
          FTP_BASE_DIR: ${{ secrets.FTP_PATH || secrets.FTP_BASE_DIR }}

      - name: Upload merged CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlimitedfurniture_products_full
          path: |
            unlimitedfurniture_products_full.csv
            unlimitedfurniture_failures_full.csv
            skipped_plp.csv
          if-no-files-found: warn
