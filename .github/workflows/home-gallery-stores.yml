name: Home Gallery Stores - Scraper (HGS)

on:
  workflow_dispatch:
    inputs:
      scrape_mode:
        description: "Scrape Mode: remaining (only unscraped pending URLs from DB) or full (all URLs)"
        type: choice
        required: true
        default: "remaining"
        options:
          - "remaining"
          - "full"
      urls_per_runner:
        description: "Max product URLs to scrape per parallel runner (recommended 300-400 to complete well within 4h)"
        required: false
        default: "350"
      total_runners:
        description: "Parallel runners (0 = auto-calculate based on total URLs)"
        required: false
        default: "0"
      max_total_urls:
        description: "Max total URLs to scrape (0 = all / full 63,624)"
        required: false
        default: "0"
      max_workers:
        description: "Parallel requests per runner job"
        required: false
        default: "16"
      download_delay:
        description: "Delay between requests in seconds"
        required: false
        default: "0.1"

permissions:
  contents: read
  actions: write

env:
  WEBSITE_URL: "https://homegallerystores.com"
  SITE_KEY: "homegallerystores"
  COMPETITOR_NAME: "HomeGalleryStores"
  SCRAPE_MODE: ${{ github.event.inputs.scrape_mode || 'remaining' }}
  MYSQL_HOST: "2.24.198.101"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_PASS: "Root@123456"
  MYSQL_DB: "google_shopping"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      total_runners: ${{ steps.build_matrix.outputs.total_runners }}
      total_urls: ${{ steps.build_matrix.outputs.total_urls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pymysql

      - name: Collect URLs and Partition Matrix
        id: collect_urls
        env:
          URLS_PER_RUNNER: ${{ github.event.inputs.urls_per_runner || '350' }}
          TOTAL_RUNNERS_INPUT: ${{ github.event.inputs.total_runners || '0' }}
          MAX_TOTAL_URLS: ${{ github.event.inputs.max_total_urls || '0' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap/' }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, sys, json, math, gzip, ftplib
          import xml.etree.ElementTree as ET
          import urllib.request

          urls_per_runner = int(os.environ.get('URLS_PER_RUNNER', '350') or '350')
          total_runners_input = int(os.environ.get('TOTAL_RUNNERS_INPUT', '0') or '0')
          max_total_urls = int(os.environ.get('MAX_TOTAL_URLS', '0') or '0')
          site_key = "homegallerystores"

          os.makedirs("url_chunks", exist_ok=True)
          urls = []

          # 1. First priority: local pre-collected URLs file
          local_file = f"urls/all_urls_{site_key}.txt"
          if os.path.exists(local_file) and os.path.getsize(local_file) > 0:
              print(f"✓ Found local URL list: {local_file}")
              with open(local_file, "r", encoding="utf-8") as f:
                  urls = [line.strip() for line in f if line.strip() and line.strip().startswith("http")]
              print(f"Loaded {len(urls):,} URLs from local repository.")

          # 2. Second priority: FTP pre-collected URLs file
          if not urls:
              ftp_host = os.environ.get("FTP_HOST", "").strip()
              ftp_user = os.environ.get("FTP_USER", "").strip()
              ftp_pass = os.environ.get("FTP_PASS", "").strip()
              ftp_port = int(os.environ.get("FTP_PORT", "21") or "21")
              ftp_path = os.environ.get("FTP_PATH", "/scrap/").strip().rstrip("/")

              if ftp_host and ftp_user and ftp_pass:
                  remote_file = f"{ftp_path}/urls/all_urls_{site_key}.txt"
                  print(f"Attempting to download URLs from FTP: {remote_file}")
                  try:
                      client = ftplib.FTP()
                      client.connect(ftp_host, ftp_port, timeout=30)
                      client.login(ftp_user, ftp_pass)
                      with open("temp_urls.txt", "wb") as f_out:
                          client.retrbinary(f"RETR {remote_file}", f_out.write)
                      client.quit()
                      if os.path.exists("temp_urls.txt") and os.path.getsize("temp_urls.txt") > 0:
                          with open("temp_urls.txt", "r", encoding="utf-8") as f:
                              urls = [line.strip() for line in f if line.strip() and line.strip().startswith("http")]
                          print(f"✓ Loaded {len(urls):,} URLs from FTP.")
                  except Exception as e:
                      print(f"⚠ Could not download from FTP: {e}")

          # 3. Third priority: sitemap discovery
          if not urls:
              sitemap_index = "https://homegallerystores.com/sitemap/hgs/sitemap_index.xml.gz"
              print(f"Falling back to sitemap discovery: {sitemap_index}")
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
              req = urllib.request.Request(sitemap_index, headers=headers)
              root = ET.fromstring(gzip.decompress(urllib.request.urlopen(req).read()))
              ns = {"ns": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              product_sitemaps = [sm.text.strip() for sm in root.findall(".//ns:loc", ns) if "sitemap_cat_" in sm.text]

              p_set = set()
              for sm_url in product_sitemaps:
                  try:
                      r2 = urllib.request.Request(sm_url, headers=headers)
                      data = gzip.decompress(urllib.request.urlopen(r2).read())
                      sm_root = ET.fromstring(data)
                      for u in sm_root.findall(".//ns:loc", ns):
                          u_text = u.text.strip()
                          if not u_text.endswith(".htm") and not u_text.endswith(".html") and "/resources/" not in u_text:
                              p_set.add(u_text)
                  except Exception as ex:
                      print(f"Error reading {sm_url}: {ex}")
              urls = sorted(list(p_set))
              print(f"✓ Discovered {len(urls):,} pure product URLs from sitemaps.")

          if max_total_urls > 0 and len(urls) > max_total_urls:
              print(f"Limiting total URLs to {max_total_urls:,} (from {len(urls):,})")
              urls = urls[:max_total_urls]

          total_urls = len(urls)
          if total_urls == 0:
              print("❌ No URLs found to scrape!")
              sys.exit(1)

          if total_runners_input > 0:
              num_runners = min(total_runners_input, total_urls)
          else:
              num_runners = max(1, math.ceil(total_urls / urls_per_runner))

          # Cap at 256 for GitHub Actions matrix limits
          num_runners = min(num_runners, 256)
          chunk_size = math.ceil(total_urls / num_runners)

          print(f"════════════════════════════════════════════════════════════")
          print(f" Total Product URLs: {total_urls:,}")
          print(f" Parallel Runners: {num_runners}")
          print(f" URLs per Runner: ~{chunk_size}")
          print(f" 100% URLs Covered Without Omission")
          print(f"════════════════════════════════════════════════════════════")

          manifest = []
          for i in range(num_runners):
              start = i * chunk_size
              end = min(start + chunk_size, total_urls)
              chunk_urls = urls[start:end]
              chunk_filename = f"url_chunks/chunk_{i}.txt"
              with open(chunk_filename, "w", encoding="utf-8") as f_chunk:
                  for u in chunk_urls:
                      f_chunk.write(u + "\n")
              manifest.append({
                  "chunk_id": i,
                  "chunk_file": chunk_filename,
                  "url_count": len(chunk_urls),
                  "total_chunks": num_runners
              })

          with open("url_chunks/manifest.json", "w", encoding="utf-8") as f_manifest:
              json.dump(manifest, f_manifest, indent=2)

          with open("all_urls_homegallerystores.txt", "w", encoding="utf-8") as f_all:
              for u in urls:
                  f_all.write(u + "\n")
          EOF

      - name: Build clean runner matrix
        id: build_matrix
        run: |
          python3 -c "
          import json, os
          with open('url_chunks/manifest.json') as f:
              manifest = json.load(f)
          matrix_items = [{'chunk_id': item['chunk_id'], 'chunk_file': item['chunk_file'], 'url_count': item['url_count']} for item in manifest]
          matrix_json = json.dumps({'include': matrix_items})
          total_urls = sum(item['url_count'] for item in manifest)
          print(f'Total planned runners: {len(matrix_items)} covering {total_urls:,} URLs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fo:
              fo.write(f'matrix={matrix_json}\n')
              fo.write(f'total_runners={len(matrix_items)}\n')
              fo.write(f'total_urls={total_urls}\n')
          "

      - name: Upload URL chunks artifact
        uses: actions/upload-artifact@v4
        with:
          name: hgs_url_chunks
          path: url_chunks/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload master URL list artifact
        uses: actions/upload-artifact@v4
        with:
          name: hgs_all_urls
          path: all_urls_homegallerystores.txt
          retention-days: 2
          if-no-files-found: warn

  scrape:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: "Scrape chunk ${{ matrix.chunk_id }} (${{ matrix.url_count }} URLs)"
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix || '{"include":[]}') }}

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        continue-on-error: true
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 10
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "⚠ FlareSolverr not ready after 60 seconds, continuing anyway..."
              break
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r colemanfurniture_brand_file_scraper/requirements.txt || pip install scrapy pandas lxml requests beautifulsoup4 curl_cffi cloudscraper pymysql
          pip install pymysql

      - name: Download URL chunks
        uses: actions/download-artifact@v4
        with:
          name: hgs_url_chunks
          path: url_chunks

      - name: Create output directory
        run: mkdir -p output

      - name: Run Scraper
        env:
          CHUNK_ID: ${{ matrix.chunk_id }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '16' }}
          DOWNLOAD_DELAY: ${{ github.event.inputs.download_delay || '0.1' }}
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          MYSQL_HOST: ${{ secrets.MYSQL_HOST || '2.24.198.101' }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER || 'root' }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS || 'Root@123456' }}
          MYSQL_DB: ${{ secrets.MYSQL_DB || 'google_shopping' }}
          SCRAPE_MODE: ${{ github.event.inputs.scrape_mode || 'remaining' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap/' }}
        run: |
          CHUNK_ID="${{ matrix.chunk_id }}"
          URLS_FILE="url_chunks/chunk_${CHUNK_ID}.txt"
          JOB_ID="chunk_${CHUNK_ID}"
          
          echo "════════════════════════════════════════════════════════════"
          echo " Starting Scraper for Home Gallery Stores (Chunk $CHUNK_ID)"
          echo " URLS_FILE: $URLS_FILE (${{ matrix.url_count }} URLs)"
          echo " Max Workers: $MAX_WORKERS | Delay: $DOWNLOAD_DELAY s"
          echo "════════════════════════════════════════════════════════════"

          python colemanfurniture_brand_file_scraper/scripts/run.py \
            --website-url "https://homegallerystores.com" \
            --job-id "$JOB_ID" \
            --output-dir output \
            --urls-file "$URLS_FILE" \
            --verbose

          OUTPUT_CSV=$(ls output/output_*_${JOB_ID}_*.csv 2>/dev/null || ls output/output_*_${JOB_ID}.csv 2>/dev/null || echo "")
          if [ -n "$OUTPUT_CSV" ] && [ -f "$OUTPUT_CSV" ]; then
            cp "$OUTPUT_CSV" "output/products_homegallerystores_chunk_${CHUNK_ID}.csv"
            echo "✓ Saved products_homegallerystores_chunk_${CHUNK_ID}.csv ($(wc -l < "$OUTPUT_CSV") rows)"
          else
            echo "Ref Product URL,Ref Product ID,Ref Variant ID,Ref Category,Ref Category URL,Product Type,Ref Brand Name,Collection Name,Ref Product Name,Ref SKU,Ref MPN,Ref GTIN,Ref Price,Ref Main Image,Ref Quantity,Ref Group Attr 1,Ref Group Attr 2,Ref Images,Ref Dimensions,Ref Status,Ref Highlights,Row JSON,Date Scrapped" > "output/products_homegallerystores_chunk_${CHUNK_ID}.csv"
          fi

      - name: Rescue chunk output to FTP
        if: always()
        env:
          CHUNK_ID: ${{ matrix.chunk_id }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap/' }}
        run: |
          python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os, glob, sys
          from datetime import datetime, timezone
          sys.path.insert(0, ".")
          from ftp_manager import FTPManager, normalize_competitor_name

          host = os.environ.get("FTP_HOST", "").strip()
          user = os.environ.get("FTP_USER", "").strip()
          pass_ = os.environ.get("FTP_PASS", "").strip()
          port = int(os.environ.get("FTP_PORT", "21") or "21")
          base_path = os.environ.get("FTP_PATH", "/scrap/").strip()
          chunk_id = os.environ.get("CHUNK_ID", "0")

          if not host or not user or not pass_:
              print("No FTP configured, skipping rescue upload.")
              sys.exit(0)

          target_file = f"output/products_homegallerystores_chunk_{chunk_id}.csv"
          if not os.path.exists(target_file) or os.path.getsize(target_file) <= 100:
              csvs = glob.glob(f"output/output_*_chunk_{chunk_id}_*.csv")
              if csvs:
                  target_file = csvs[0]

          if not os.path.exists(target_file) or os.path.getsize(target_file) <= 100:
              print(f"No chunk data to rescue for chunk {chunk_id}.")
              sys.exit(0)

          date_dir = datetime.now(timezone.utc).strftime("%Y%m%d")
          remote_dir = f"{base_path.rstrip('/')}/HomeGalleryStores/{date_dir}/output/temp"
          remote_path = f"{remote_dir}/products_homegallerystores_chunk_{chunk_id}.csv"

          try:
              ftp = FTPManager(host, user, pass_, port, base_path)
              ftp.connect()
              ftp.upload_file(target_file, remote_path)
              print(f"✓ Rescued chunk {chunk_id} to FTP: {remote_path}")
              ftp.disconnect()
          except Exception as e:
              print(f"⚠ FTP rescue failed: {e}")
          EOF

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk_${{ matrix.chunk_id }}
          path: |
            output/products_homegallerystores_chunk_${{ matrix.chunk_id }}.csv
            output/output_*_chunk_${{ matrix.chunk_id }}_*.csv
            output/remaining_*_chunk_${{ matrix.chunk_id }}*.csv
            output/unscraped_*_chunk_${{ matrix.chunk_id }}*.csv
          retention-days: 3
          if-no-files-found: warn

  merge:
    needs: [plan, scrape]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Download master URL list
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hgs_all_urls
          path: master_urls

      - name: Merge CSVs and Sync to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/scrap/' }}
        run: |
          mkdir -p chunks master_urls ftp_output
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          FILE_DATE=$(date +%F_%H%M%S)

          echo "Listing all downloaded chunk files:"
          find chunks -type f | sort || true

          OUTPUT_FILE="products_homegallerystores_${FILE_DATE}.csv"
          SITE_CSVS=$(find chunks -name "products_homegallerystores_chunk_*.csv" 2>/dev/null || true)
          if [ -z "$SITE_CSVS" ]; then
            SITE_CSVS=$(find chunks -name "output_*_chunk_*.csv" 2>/dev/null || true)
          fi

          if [ -n "$SITE_CSVS" ]; then
            FIRST_FILE=$(echo "$SITE_CSVS" | head -n 1)
            head -n 1 "$FIRST_FILE" > "$OUTPUT_FILE"
            for f in $SITE_CSVS; do
              tail -n +2 "$f" 2>/dev/null | sed '/^$/d' >> "$OUTPUT_FILE"
            done
            ROW_COUNT=$(wc -l < "$OUTPUT_FILE" | tr -d ' ')
            echo "✓ Merged $OUTPUT_FILE ($ROW_COUNT rows)"
          else
            echo "Ref Product URL,Ref Product ID,Ref Variant ID,Ref Category,Ref Category URL,Product Type,Ref Brand Name,Collection Name,Ref Product Name,Ref SKU,Ref MPN,Ref GTIN,Ref Price,Ref Main Image,Ref Quantity,Ref Group Attr 1,Ref Group Attr 2,Ref Images,Ref Dimensions,Ref Status,Ref Highlights,Row JSON,Date Scrapped" > "$OUTPUT_FILE"
            echo "⚠ No chunk CSVs found, created empty schema file."
          fi

          # Master URLs tracking file
          URL_FILE="all_sitemap_urls_homegallerystores.txt"
          if [ -f "master_urls/all_urls_homegallerystores.txt" ]; then
            cp "master_urls/all_urls_homegallerystores.txt" "$URL_FILE"
          elif [ -f "urls/all_urls_homegallerystores.txt" ]; then
            cp "urls/all_urls_homegallerystores.txt" "$URL_FILE"
          else
            touch "$URL_FILE"
          fi
          URL_COUNT=$(wc -l < "$URL_FILE" | tr -d ' ')
          echo "✓ Total URLs to track: $URL_COUNT"

          # Standard FTP directory layout
          COMPETITOR="HomeGalleryStores"
          INPUT_DIR="ftp_output/${COMPETITOR}/${DATE}/input"
          TEMP_DIR="ftp_output/${COMPETITOR}/${DATE}/output/temp"
          FINAL_DIR="ftp_output/${COMPETITOR}/${DATE}/output"

          mkdir -p "$INPUT_DIR" "$TEMP_DIR" "$FINAL_DIR"

          INPUT_URL="$INPUT_DIR/URLList${TIMESTAMP}.csv"
          TEMP_URL="$TEMP_DIR/URLListForScrap${TIMESTAMP}.csv"
          FINAL_SCRAPED="$FINAL_DIR/FinalScrappedData${TIMESTAMP}.csv"
          FINAL_URL="$FINAL_DIR/FinalURLListForScrap${TIMESTAMP}.csv"

          cp "$URL_FILE" "$INPUT_URL" 2>/dev/null || true
          cp "$URL_FILE" "$TEMP_URL" 2>/dev/null || true
          cp "$OUTPUT_FILE" "$FINAL_SCRAPED" 2>/dev/null || true

          # Generate FinalURLListForScrap (Scraped vs Not Scraped tracking)
          if [ -f "$TEMP_URL" ] && [ -f "$FINAL_SCRAPED" ] && [ -s "$FINAL_SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$TEMP_URL" --scraped-file "$FINAL_SCRAPED" --output-file "$FINAL_URL" || true
          fi

          # Upload to FTP server
          if [ -n "$FTP_HOST" ]; then
            echo "Uploading $COMPETITOR output to FTP server..."
            python3 ftp_manager.py upload -c "$COMPETITOR" -b ftp_output || {
              echo "ftp_manager upload failed, falling back to lftp..."
              which lftp >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y lftp)
              BASE="${FTP_PATH}/${COMPETITOR}/${DATE}"
              lftp -e "set ftp:ssl-allow no; mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}; bye" -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" || true
              echo "FTP upload complete: ${BASE}"
            } || true
          fi

      - name: Archive final merged CSV
        uses: actions/upload-artifact@v4
        with:
          name: homegallerystores_merged_csv
          path: products_homegallerystores_*.csv
          retention-days: 7
          if-no-files-found: warn

